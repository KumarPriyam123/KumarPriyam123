    .r1{animation-delay:1.3s}.r2{animation-delay:4.3s}
    .r3{animation-delay:7.3s}.r4{animation-delay:10.3s}
    @media (prefers-reduced-motion:reduce){
      .dash,.f,.rise,.rot{animation:none}
      .dash{stroke-dashoffset:0}
      .f,.rise{opacity:1;transform:none}
      .rot{opacity:0}.rot.r1{opacity:1}
    }
  </style>

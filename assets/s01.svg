  <style>
    .dash{stroke-dasharray:1;stroke-dashoffset:1;
          animation:dash 1.15s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes dash{to{stroke-dashoffset:0}}
    .f{opacity:0;animation:f .8s ease forwards}
    @keyframes f{to{opacity:1}}
    .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}
                    to{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:.05s}.d2{animation-delay:.22s}.d3{animation-delay:.45s}
    .d4{animation-delay:.70s}.d5{animation-delay:.95s}.d6{animation-delay:1.2s}
    .d7{animation-delay:1.45s}
    .rot{opacity:0;animation:rot 12s linear infinite}
    @keyframes rot{0%{opacity:0}2%{opacity:1}21%{opacity:1}25%{opacity:0}100%{opacity:0}}
    .r1{animation-delay:1.3s}.r2{animation-delay:4.3s}
    .r3{animation-delay:7.3s}.r4{animation-delay:10.3s}
    @media (prefers-reduced-motion:reduce){
      .dash,.f,.rise,.rot{animation:none}
      .dash{stroke-dashoffset:0}
      .f,.rise{opacity:1;transform:none}
      .rot{opacity:0}.rot.r1{opacity:1}
    }
  </style>
